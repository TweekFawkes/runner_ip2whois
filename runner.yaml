runner:
  name: IP to Whois
  description: Queries via Whois for the provided IP address.
  version: 0.0.1

build:
  commands: |
    echo "START: Building the runner"
    apt update
    apt install -y whois
    echo "END: Building the runner"

webform:
  - name: ip_address
    prompt: IP Address
    type: text

launch:
  type: binary
  command: whois ${ip_address}
